*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,Roboto,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}

.logo.big{width:84px;height:84px;font-size:32px}
header b{display:block;font:700 16px Georgia,serif;direction:ltr}

main{padding:14px;max-width:760px;margin:auto;zoom:var(--z)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,39,71,.08)}
h2{font-size:16px;margin-bottom:10px;color:var(--h)}h2.sec{margin:16px 2px 10px}
p.m{color:var(--muted);font-size:13px;margin-bottom:8px;line-height:1.7}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}.ln{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
button{font-size:14px;cursor:pointer;border:none;border-radius:10px;padding:11px 14px}
.primary{width:100%;background:var(--navy);color:#fff;font-weight:700;margin-top:8px}
.gold{background:var(--gold);color:var(--navy);font-weight:700}
.ghost{background:transparent;border:1px dashed var(--gold);color:var(--h);width:100%;margin-bottom:8px}
.x{background:transparent;color:var(--bad);padding:2px 8px;font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:var(--card);color:var(--text);font-size:12px;padding:9px 4px}.seg .on{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start}

tr.t td{font-weight:700;border-top:2px solid var(--line)}tr.g td{background:rgba(201,162,75,.18);font-weight:800}
.tot{font-size:13px;margin:6px 0}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.err{color:var(--bad);font-size:13px;min-height:18px}
.eh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.eh .x{margin-inline-start:auto}
.tag{background:rgba(201,162,75,.25);color:var(--h);font-size:11px;padding:2px 8px;border-radius:20px}
.st,.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.set select,.set .ti{width:52%;margin:0}.set input[type=checkbox]{width:22px;height:22px;margin:0}.set input[type=range]{width:52%;margin:0;padding:0}

footer{text-align:center;color:var(--muted);font-size:12px;padding:8px}
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--navy),#08162b);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
#lock h1{font:700 22px Georgia,serif}#lock p{color:#c6d0e3}#lock input{max-width:280px;text-align:center}#lock .primary{max-width:280px;background:var(--gold);color:var(--navy)}

newEntry:['New journal entry','قيد يومية جديد'],regular:['Regular','عادي'],adjusting:['Adjusting','تسوية'],closing:['Closing','إقفال'],desc:['Description (e.g. Cash purchase of goods)','البيان (مثال: شراء بضاعة نقداً)'],pick:['Select account','اختر الحساب'],dr:['Debit','مدين'],cr:['Credit','دائن'],addLine:['+ Add line','+ إضافة سطر'],bal:['Balanced','متوازن'],unbal:['Not balanced','غير متوازن'],saveEntry:['Save entry','حفظ القيد'],journal:['Journal','سجل القيود'],none:['Nothing here yet.','لا توجد بيانات بعد.'],

addAcc:['Add account','إضافة حساب'],code:['Code','الكود'],aname:['Account name','اسم الحساب'],add:['Add','إضافة'],asset:['Assets','أصول'],liability:['Liabilities','التزامات'],equity:['Equity','حقوق ملكية'],revenue:['Revenue','إيرادات'],expense:['Expenses','مصروفات'],eCodeName:['Enter code and name','اكتب الكود والاسم'],eUsed:['Code already used','هذا الكود مستخدم'],eAct:['Account has activity and cannot be deleted','عليه حركة، لا يمكن حذفه'],
gl:['General Ledger','دفتر الأستاذ'],dd:['Date & description','التاريخ والبيان'],balance:['Balance','الرصيد'],noAct:['No activity','لا توجد حركة'],
tb:['Trial Balance','ميزان المراجعة'],raw:['Before adjusting','قبل التسوية'],adj:['After adjusting','بعد التسوية'],post:['After closing','بعد الإقفال'],account:['Account','الحساب'],total:['Total','الإجمالي'],tbOk:['✓ Trial balance is balanced','✓ الميزان متوازن'],tbNo:['✗ Trial balance is not balanced','✗ الميزان غير متوازن'],prep:['Prepared by','إعداد'],
is:['Income Statement','قائمة الدخل'],bs:['Balance Sheet','قائمة المركز المالي'],tRev:['Total revenue','إجمالي الإيرادات'],tExp:['Total expenses','إجمالي المصروفات'],ni:['Net income','صافي الربح'],nl:['Net loss','صافي الخسارة'],tAs:['Total assets','إجمالي الأصول'],tLi:['Total liabilities','إجمالي الالتزامات'],tEq:['Total equity','إجمالي حقوق الملكية'],tLE:['Liabilities + Equity','الالتزامات + حقوق الملكية'],niOpen:['Net income (before closing)','صافي الربح (قبل الإقفال)'],eqOk:['✓ Assets = Liabilities + Equity','✓ الأصول = الالتزامات + حقوق الملكية'],eqNo:['✗ Accounting equation is not balanced','✗ المعادلة المحاسبية غير متوازنة'],
s1:['1. Analyze source documents','1. تحليل المستندات'],s2:['2. Journal entries','2. قيود اليومية'],s3:['3. Post to ledger','3. الترحيل للأستاذ'],s4:['4. Unadjusted trial balance','4. ميزان المراجعة قبل التسوية'],s5:['5. Adjusting entries','5. قيود التسوية'],s6:['6. Adjusted trial balance','6. ميزان المراجعة بعد التسوية'],s7:['7. Financial statements','7. القوائم المالية'],s8:['8. Closing entries','8. قيود الإقفال'],s9:['9. Post-closing trial balance','9. ميزان ما بعد الإقفال'],

settings:['Settings','الإعدادات'],general:['General','عام'],language:['Language','اللغة'],currency:['Currency','العملة'],decimals:['Decimal places','الخانات العشرية'],theme:['Theme','المظهر'],auto2:['Auto','تلقائي'],light:['Light','فاتح'],dark:['Dark','داكن'],tsize:['Text size','حجم الخط'],small:['Small','صغير'],medium:['Medium','متوسط'],large:['Large','كبير'],

look:['Appearance','المظهر العام'],wmShow:['Show logo watermark','إظهار شعار الخلفية'],wmStr:['Watermark strength','وضوح الشعار'],data:['Data','البيانات'],dataP:['Data is stored on this device only. Save a backup to move it to another device.','البيانات محفوظة على هذا الجهاز فقط. احفظي نسخة لنقلها لجهاز آخر.'],backup:['Backup','حفظ نسخة'],restore:['Restore','استرجاع'],csv:['Export CSV','تصدير CSV'],print:['Print / PDF','طباعة / PDF'],reset:['Erase all entries','مسح كل القيود'],cReset:['This will erase all entries and accounts. Continue?','سيتم مسح كل القيود والحسابات. متأكدة؟'],badFile:['Invalid file','ملف غير صالح'],about:['About','عن البرنامج']};
const t=k=>(D[k]||[k,k])[S.settings.lang==='ar'?1:0];
const KINDS={raw:['regular'],adj:['regular','adjusting'],post:['regular','adjusting','closing']};
const TABS=[['entries','📒'],['accounts','🗂️'],['ledger','📖'],['trial','⚖️'],['reports','📊'],['cycle','🔒']];
function norm(s){
 if(!s||!s.accounts||!s.entries)s={accounts:[],entries:[]};
 const km={'عادي':'regular','تسوية':'adjusting','إقفال':'closing'};
 if(!s.accounts.length)s.accounts=DEF.map(a=>({code:a[0],name:a[1],ar:a[2],type:a[3]}));
 s.accounts.forEach(a=>{const d=DEF.find(x=>x[0]===a.code);if(d&&!a.ar){a.name=d[1];a.ar=d[2]}});
 s.entries.forEach(e=>e.kind=km[e.kind]||e.kind);
 s.settings=Object.assign({lang:'en',cur:'USD',dec:2,theme:'auto',size:'m',co:'',acct:'Abdelazeem Mandour',wm:true,wmo:11,lockLeave:false,pw:''},s.settings);
 return s}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}return norm(s)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),tab='entries',LA='',TS='raw';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:+S.settings.dec,maximumFractionDigits:+S.settings.dec});
const mny=n=>(CUR.find(c=>c[0]===S.settings.cur)||CUR[0])[1]+' '+fmt(n);
const acc=c=>S.accounts.find(a=>a.code===c),nm=a=>S.settings.lang==='ar'&&a.ar?a.ar:a.name;
const sorted=()=>[...S.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
const opts=()=>`<option value="">${t('pick')}</option>`+S.accounts.map(a=>`<option value="${a.code}">${a.code} – ${esc(nm(a))}</option>`).join('');
const tr=(a,b,c='')=>`<tr class="${c}"><td>${a}</td><td>${b}</td></tr>`;
const hdr=()=>`<p class="m">${S.settings.co?esc(S.settings.co)+' · ':''}${t('prep')}: ${esc(S.settings.acct)} · ${new Date().toLocaleDateString('en-GB')}</p>`;
function bal(st){const m={};S.accounts.forEach(a=>m[a.code]={d:0,c:0});S.entries.forEach(e=>{if(KINDS[st].includes(e.kind))e.lines.forEach(l=>{if(m[l.acc]){m[l.acc].d+=l.d;m[l.acc].c+=l.c}})});return m}
function apply(){const s=S.settings,r=document.documentElement;r.lang=s.lang;r.dir=s.lang==='ar'?'rtl':'ltr';if(s.theme==='auto')r.removeAttribute('data-theme');else r.dataset.theme=s.theme;r.style.setProperty('--z',{s:.9,m:1,l:1.12}[s.size]);r.style.setProperty('--wmo',s.wmo/100);$('#wm').style.display=s.wm?'':'none';$('#sub').textContent=t('sub');document.title=t('sub')+' – Abdelazeem Mandour'}
function go(x){tab=x;show();scrollTo(0,0)}
function show(){$('#app').innerHTML=V[tab]();$('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${t(x[0])}</button>`).join('');if(tab==='entries'){addLine();addLine()}}

/* Entries */
function vEntries(){
 const list=sorted(),num=new Map(list.map((e,i)=>[e.id,i+1]));
 return `<div class="card"><h2>${t('newEntry')}</h2><div class="row"><input type="date" id="ed" value="${new Date().toISOString().slice(0,10)}"><select id="ek"><option value="regular">${t('regular')}</option><option value="adjusting">${t('adjusting')}</option></select></div>
 <input id="edesc" placeholder="${t('desc')}"><div id="lines"></div><button class="ghost" onclick="addLine()">${t('addLine')}</button><div id="tot" class="tot"></div><div id="err" class="err"></div>
 <button class="primary" onclick="saveEntry()">${t('saveEntry')}</button></div><h2 class="sec">${t('journal')} (${list.length})</h2>`+
 (list.length?[...list].reverse().map(e=>`<div class="card"><div class="eh"><b>#${num.get(e.id)} · ${e.date}</b><span class="tag">${t(e.kind)}</span><button class="x" onclick="delEntry(${e.id})">${t('del')}</button></div><p class="m">${esc(e.desc)}</p><table>${e.lines.map(l=>`<tr><td>${esc(nm(acc(l.acc)||{name:l.acc}))}</td><td>${l.d?fmt(l.d):''}</td><td>${l.c?fmt(l.c):''}</td></tr>`).join('')}</table></div>`).join(''):`<p class="m">${t('none')}</p>`);
}
function addLine(){const d=document.createElement('div');d.className='ln';d.innerHTML=`<select>${opts()}</select><input type="number" inputmode="decimal" min="0" step="any" placeholder="${t('dr')}"><input type="number" inputmode="decimal" min="0" step="any" placeholder="${t('cr')}">`;d.oninput=tot;$('#lines').append(d);tot()}
function tot(){let a=0,b=0;document.querySelectorAll('.ln').forEach(r=>{a+=+r.children[1].value||0;b+=+r.children[2].value||0});const ok=Math.abs(a-b)<.005&&a>0;$('#tot').innerHTML=`${t('dr')}: <b>${fmt(a)}</b> — ${t('cr')}: <b>${fmt(b)}</b> <span class="${ok?'ok':'bad'}">${ok?'✓ '+t('bal'):t('unbal')}</span>`}
function saveEntry(){
 const err=m=>{$('#err').textContent=m},lines=[...document.querySelectorAll('.ln')].map(r=>({acc:r.children[0].value,d:+r.children[1].value||0,c:+r.children[2].value||0})).filter(l=>l.acc||l.d||l.c);
 const a=lines.reduce((s,l)=>s+l.d,0),b=lines.reduce((s,l)=>s+l.c,0);
 if(!$('#edesc').value.trim())return err(t('eDesc'));
 if(lines.length<2)return err(t('eLines'));
 if(lines.some(l=>!l.acc||l.d<0||l.c<0||(l.d>0)===(l.c>0)))return err(t('eLine'));
 if(Math.abs(a-b)>.005)return err(t('eBal'));
 S.entries.push({id:Date.now(),date:$('#ed').value,desc:$('#edesc').value.trim(),kind:$('#ek').value,lines});save();show();
}
function delEntry(id){if(confirm(t('cDel'))){S.entries=S.entries.filter(e=>e.id!==id);save();show()}}

/* Accounts */
const TY=['asset','liability','equity','revenue','expense'];
function vAccounts(){
 return `<div class="card"><h2>${t('addAcc')}</h2><div class="row"><input id="nc" placeholder="${t('code')}" inputmode="numeric"><select id="nt">${TY.map(x=>`<option value="${x}">${t(x)}</option>`).join('')}</select></div><input id="nn" placeholder="${t('aname')}"><button class="primary" onclick="addAcc()">${t('add')}</button></div>`+
 TY.map(x=>`<div class="card"><h2>${t(x)}</h2><table>${S.accounts.filter(a=>a.type===x).map(a=>`<tr><td>${a.code} – ${esc(nm(a))}</td><td><button class="x" onclick="delAcc('${a.code}')">${t('del')}</button></td></tr>`).join('')}</table></div>`).join('');
}
function addAcc(){const code=$('#nc').value.trim(),name=$('#nn').value.trim();if(!code||!name)return alert(t('eCodeName'));if(acc(code))return alert(t('eUsed'));S.accounts.push({code,name,ar:name,type:$('#nt').value});S.accounts.sort((a,b)=>a.code.localeCompare(b.code));save();show()}
function delAcc(c){if(S.entries.some(e=>e.lines.some(l=>l.acc===c)))return alert(t('eAct'));S.accounts=S.accounts.filter(a=>a.code!==c);save();show()}

/* Ledger */
function vLedger(){
 if(!acc(LA))LA=S.accounts[0].code;const a=acc(LA),nat=a.type==='asset'||a.type==='expense'?1:-1;let run=0;
 const rows=sorted().flatMap(e=>e.lines.filter(l=>l.acc===LA).map(l=>{run+=(l.d-l.c)*nat;return`<tr><td>${e.date}<br><small>${esc(e.desc)}</small></td><td>${l.d?fmt(l.d):''}</td><td>${l.c?fmt(l.c):''}</td><td>${fmt(run)}</td></tr>`})).join('');
 return `<div class="card"><h2>${t('gl')}</h2><select onchange="LA=this.value;show()">${S.accounts.map(x=>`<option value="${x.code}" ${x.code===LA?'selected':''}>${x.code} – ${esc(nm(x))}</option>`).join('')}</select><table><tr><th>${t('dd')}</th><th>${t('dr')}</th><th>${t('cr')}</th><th>${t('balance')}</th></tr>${rows||`<tr><td colspan="4">${t('noAct')}</td></tr>`}</table></div>`;
}

/* Trial balance */
function setTS(x){TS=x;show()}
function vTrial(){
 const m=bal(TS);let a=0,b=0;
 const rows=S.accounts.map(x=>{const n=m[x.code].d-m[x.code].c;if(Math.abs(n)<.005)return'';n>0?a+=n:b-=n;return`<tr><td>${x.code} ${esc(nm(x))}</td><td>${n>0?fmt(n):''}</td><td>${n<0?fmt(-n):''}</td></tr>`}).join('');
 const ok=Math.abs(a-b)<.005;
 return `<div class="seg">${['raw','adj','post'].map(x=>`<button class="${TS===x?'on':''}" onclick="setTS('${x}')">${t(x)}</button>`).join('')}</div>
 <div class="card"><h2>${t('tb')}</h2>${hdr()}<table><tr><th>${t('account')}</th><th>${t('dr')}</th><th>${t('cr')}</th></tr>${rows||`<tr><td colspan="3">${t('none')}</td></tr>`}<tr class="t"><td>${t('total')}</td><td>${mny(a)}</td><td>${mny(b)}</td></tr></table><p class="tot ${ok?'ok':'bad'}">${t(ok?'tbOk':'tbNo')}</p></div>`;
}

/* Reports */
function vReports(){
 const m=bal('adj'),p=bal('post'),n=(x,a)=>x[a.code].d-x[a.code].c,sum=r=>r.reduce((s,x)=>s+x[1],0);
 const pick=(ty,sg,x)=>S.accounts.filter(a=>a.type===ty).map(a=>[nm(a),sg*n(x,a)]).filter(r=>Math.abs(r[1])>.004);
 const rows=r=>r.map(x=>tr(esc(x[0]),mny(x[1]))).join('');
 const rev=pick('revenue',-1,m),exp=pick('expense',1,m),NI=sum(rev)-sum(exp);
 const as=pick('asset',1,p),li=pick('liability',-1,p),eq=pick('equity',-1,p),open=sum(pick('revenue',-1,p))-sum(pick('expense',1,p));
 if(Math.abs(open)>.004)eq.push([t('niOpen'),open]);
 const A=sum(as),L=sum(li)+sum(eq),ok=Math.abs(A-L)<.005;
 return `<div class="card"><h2>${t('is')}</h2>${hdr()}<table>${rows(rev)}${tr(t('tRev'),mny(sum(rev)),'t')}${rows(exp)}${tr(t('tExp'),mny(sum(exp)),'t')}${tr(t(NI>=0?'ni':'nl'),mny(Math.abs(NI)),'g')}</table></div>
 <div class="card"><h2>${t('bs')}</h2>${hdr()}<table>${rows(as)}${tr(t('tAs'),mny(A),'t g')}${rows(li)}${tr(t('tLi'),mny(sum(li)),'t')}${rows(eq)}${tr(t('tEq'),mny(sum(eq)),'t')}${tr(t('tLE'),mny(L),'t g')}</table><p class="tot ${ok?'ok':'bad'}">${t(ok?'eqOk':'eqNo')}</p></div>`;
}

/* Cycle & closing */
function vCycle(){
 const c=k=>S.entries.filter(e=>e.kind===k).length,n=k=>c(k)+' '+t('ent');
 const st=[['s1',t('manual')],['s2',n('regular')],['s3',t('auto')],['s4',t('auto')],['s5',n('adjusting')],['s6',t('auto')],['s7',t('auto')],['s8',n('closing')],['s9',t('auto')]];
 return `<div class="card"><h2>${t('cycleT')}</h2>${st.map(s=>`<div class="st"><span>${t(s[0])}</span><span class="tag">${s[1]}</span></div>`).join('')}</div>
 <div class="card"><h2>${t('closeT')}</h2><p class="m">${t('closeP')}</p><button class="primary" onclick="closeBooks()">${t('runClose')}</button><button class="ghost" style="margin-top:8px" onclick="undoClose()">${t('undoClose')}</button></div>`;
}
function closeBooks(){
 const p=bal('post'),lines=[];let x=0;
 S.accounts.forEach(a=>{if(a.type!=='revenue'&&a.type!=='expense'&&a.code!=='3102')return;const n=p[a.code].d-p[a.code].c;if(Math.abs(n)<.005)return;const amt=-n;lines.push(amt>0?{acc:a.code,d:amt,c:0}:{acc:a.code,d:0,c:-amt});x+=amt});
 if(!lines.length)return alert(t('nothing'));
 if(!acc('3101'))return alert(t('noCap'));
 lines.push(x>0?{acc:'3101',d:0,c:x}:{acc:'3101',d:-x,c:0});
 S.entries.push({id:Date.now(),date:new Date().toISOString().slice(0,10),desc:t('closeDesc'),kind:'closing',lines});save();show();
}
function undoClose(){S.entries=S.entries.filter(e=>e.kind!=='closing');save();show()}

/* Settings */
function setS(k,v){S.settings[k]=v;save();apply();show()}
function vSettings(){
 const s=S.settings,row=(l,c)=>`<div class="set"><span>${l}</span>${c}</div>`,
 sel=(k,o)=>`<select onchange="setS('${k}',this.value)">${o.map(x=>`<option value="${x[0]}" ${String(s[k])===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select>`,
 chk=k=>`<input type="checkbox" ${s[k]?'checked':''} onchange="setS('${k}',this.checked)">`,
 txt=k=>`<input class="ti" value="${esc(s[k])}" onchange="setS('${k}',this.value)">`;
 return `<div class="card"><h2>${t('general')}</h2>${row(t('language'),sel('lang',[['en','English'],['ar','العربية']]))}${row(t('currency'),sel('cur',CUR.map(c=>[c[0],c[0]+' ('+c[1]+')'])))}${row(t('decimals'),sel('dec',[[0,'0'],[2,'2'],[3,'3']]))}${row(t('theme'),sel('theme',[['auto',t('auto2')],['light',t('light')],['dark',t('dark')]]))}${row(t('tsize'),sel('size',[['s',t('small')],['m',t('medium')],['l',t('large')]]))}</div>
 <div class="card"><h2>${t('company')}</h2>${row(t('coName'),txt('co'))}${row(t('prepBy'),txt('acct'))}</div>
 <div class="card"><h2>${t('security')}</h2><p class="m">${s.pw?t('pwOn'):t('pwOff')}</p>${s.pw?`<input type="password" id="pc" placeholder="${t('curPw')}">`:''}<input type="password" id="pn" placeholder="${t('newPw')}"><input type="password" id="pn2" placeholder="${t('confPw')}"><button class="primary" onclick="setPw()">${t('savePw')}</button>${s.pw?`<button class="ghost" style="margin-top:8px" onclick="rmPw()">${t('rmPw')}</button><button class="ghost" onclick="lock()">${t('lockNow')}</button>${row(t('lockLeave'),chk('lockLeave'))}`:''}</div>
 <div class="card"><h2>${t('look')}</h2>${row(t('wmShow'),chk('wm'))}<div class="set"><span>${t('wmStr')}</span><input type="range" min="4" max="30" value="${s.wmo}" oninput="S.settings.wmo=+this.value;apply()" onchange="save()"></div></div>
 <div class="card"><h2>${t('data')}</h2><p class="m">${t('dataP')}</p><div class="row"><button class="gold" onclick="exportData()">${t('backup')}</button><button class="gold" onclick="$('#imp').click()">${t('restore')}</button><button class="gold" onclick="exportCSV()">${t('csv')}</button><button class="gold" onclick="print()">${t('print')}</button></div><input type="file" id="imp" accept=".json" hidden onchange="importData(this.files[0])"><button class="x" style="margin-top:10px" onclick="resetAll()">${t('reset')}</button></div>
 <div class="card" style="text-align:center"><h2>${t('about')}</h2><div class="logo big" style="margin:8px auto">AM</div><b style="font-family:Georgia,serif">Abdelazeem Mandour</b><p class="m">${t('sub')} · v2.0</p></div>`;
}
async function H(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('am|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'am|'+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
async function setPw(){const s=S.settings,n=$('#pn').value;if(s.pw&&await H($('#pc').value)!==s.pw)return alert(t('ePwBad'));if(n.length<4)return alert(t('ePwLen'));if(n!==$('#pn2').value)return alert(t('ePwMis'));s.pw=await H(n);save();alert(t('pwSaved'));show()}
async function rmPw(){if(await H($('#pc').value)!==S.settings.pw)return alert(t('ePwBad'));S.settings.pw='';S.settings.lockLeave=false;save();alert(t('pwRemoved'));show()}
function lock(){if(!S.settings.pw)return;let L=$('#lock');if(!L){L=document.createElement('div');L.id='lock';document.body.append(L)}
 L.innerHTML=`<div class="logo big">AM</div><h1>Abdelazeem Mandour</h1><p>${t('enterPw')}</p><input type="password" id="lp" autocomplete="current-password"><div class="err" id="le"></div><button class="primary" onclick="unlock()">${t('unlock')}</button>`;L.style.display='flex';const i=$('#lp');i.onkeydown=e=>{if(e.key==='Enter')unlock()};setTimeout(()=>i.focus(),50)}
async function unlock(){if(await H($('#lp').value)===S.settings.pw)$('#lock').style.display='none';else $('#le').textContent=t('ePwBad')}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function exportData(){dl('accounting-backup.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}
function exportCSV(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',r=[['Date','Type','Description','Code','Account','Debit','Credit'].join(',')];sorted().forEach(e=>e.lines.forEach(l=>r.push([e.date,e.kind,q(e.desc),l.acc,q((acc(l.acc)||{name:''}).name),l.d||'',l.c||''].join(','))));dl('journal.csv',new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}))}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.accounts||!s.entries)throw 0;S=norm(s);save();apply();show()}catch(e){alert(t('badFile'))}};r.readAsText(f)}
function resetAll(){if(confirm(t('cReset'))){const st=S.settings;localStorage.removeItem(KEY);S=norm(null);S.settings=st;save();show()}}

const V={entries:vEntries,accounts:vAccounts,ledger:vLedger,trial:vTrial,reports:vReports,cycle:vCycle,settings:vSettings};
apply();show();lock();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.settings.lockLeave)lock()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
