<script>
'use strict';
/*
 * Accounting engine - pure logic, no UI, no storage.
 * Works in Node and in the browser (<script> exposes window.AccountingEngine).
 * Money is stored as INTEGER minor units (e.g. cents) - never floats.
 */
(function (root) {
  class AccountingError extends Error {
    constructor(code, message, details) { super(message || code); this.name = 'AccountingError'; this.code = code; this.details = details; }
  }
  const E = (c, m, d) => new AccountingError(c, m, d);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const TYPES = ['asset', 'liability', 'equity', 'revenue', 'expense'];
  const NORMAL = { asset: 'debit', expense: 'debit', liability: 'credit', equity: 'credit', revenue: 'credit' };
  const KINDS = ['regular', 'adjusting', 'closing', 'opening'];
  const PREFIX = { regular: 'JV', adjusting: 'AJ', closing: 'CL', opening: 'OB' };
  const STAGES = {
    unadjusted: ['regular', 'opening'],
    adjusted: ['regular', 'opening', 'adjusting'],
    postClosing: ['regular', 'opening', 'adjusting', 'closing'],
  };
  const ROLES = {
    admin: ['*'],
    accountant: ['account.manage', 'entry.create', 'entry.post', 'entry.reverse', 'year.close'],
    approver: ['entry.approve', 'entry.post'],
    viewer: [],
  };

  /* ---------- money ---------- */
  function toMinor(v, dec) {
    const s0 = typeof v === 'number' ? String(v) : String(v).trim();
    if (!/^-?\d+(\.\d+)?$/.test(s0)) throw E('BAD_AMOUNT', 'Invalid amount: ' + v);
    const neg = s0[0] === '-';
    const s = neg ? s0.slice(1) : s0;
    let [i, f = ''] = s.split('.');
    if (f.length > dec) {
      if (/[^0]/.test(f.slice(dec))) throw E('TOO_MANY_DECIMALS', `Amount ${v} has more than ${dec} decimals`);
      f = f.slice(0, dec);
    }
    const n = Number(i + f.padEnd(dec, '0'));
    if (!Number.isSafeInteger(n)) throw E('AMOUNT_TOO_LARGE', 'Amount too large');
    return neg ? -n : n;
  }
  function fmtMinor(n, dec) {
    const neg = n < 0; n = Math.abs(n);
    const s = String(n).padStart(dec + 1, '0');
    const i = s.slice(0, s.length - dec), f = s.slice(s.length - dec);
    return (neg ? '-' : '') + (dec ? i + '.' + f : i);
  }
  function okDate(d) {
    if (typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
    const t = new Date(d + 'T00:00:00Z');
    return !isNaN(t) && t.toISOString().slice(0, 10) === d;
  }
  function hash(str) { // cyrb53 - tamper EVIDENCE only, not cryptographic security
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }

  class Ledger {
    constructor(opts = {}) {
      const { company = 'Company', decimals = 2, requireApproval = false, retainedEarnings = '3200', now } = opts;
      this.now = now || (() => new Date().toISOString());
      this.s = { company, dec: decimals, requireApproval, retainedEarnings, accounts: {}, entries: [], periods: {}, years: {}, seq: {}, bal: {}, audit: [], nextId: 1 };
    }
    m(v) { return toMinor(v, this.s.dec); }
    f(n) { return fmtMinor(n, this.s.dec); }

    /* ---------- internals ---------- */
    _can(user, action) {
      const p = ROLES[(user && user.role) || ''] || [];
      if (!(p.includes('*') || p.includes(action))) throw E('FORBIDDEN', `${user && user.id} is not allowed: ${action}`);
    }
    _log(user, action, ref, data = {}) {
      const a = this.s.audit, prev = a.length ? a[a.length - 1].hash : 'GENESIS';
      const rec = { seq: a.length + 1, ts: this.now(), user: user.id, action, ref, data, prev };
      rec.hash = hash(prev + JSON.stringify([rec.seq, rec.ts, rec.user, rec.action, rec.ref, rec.data]));
      a.push(rec);
    }
    _tx(fn) { // all-or-nothing
      const snap = JSON.stringify(this.s);
      try { return fn(); } catch (e) { this.s = JSON.parse(snap); throw e; }
    }
    _entry(id) { const e = this.s.entries.find((x) => x.id === id); if (!e) throw E('ENTRY_NOT_FOUND', 'Entry not found: ' + id); return e; }
    _posted() { return this.s.entries.filter((e) => e.status === 'posted'); }
    _periodFor(date) { return Object.values(this.s.periods).find((p) => p.start <= date && date <= p.end) || null; }
    _hasLines(code) { return this._posted().some((e) => e.lines.some((l) => l.account === code)); }
    _next(kind, date, reversal) {
      const key = (reversal ? 'RV' : PREFIX[kind]) + '-' + date.slice(0, 4);
      this.s.seq[key] = (this.s.seq[key] || 0) + 1;
      return key + '-' + String(this.s.seq[key]).padStart(6, '0');
    }
    _lines(lines) {
      if (!Array.isArray(lines) || !lines.length) throw E('NO_LINES', 'Entry has no lines');
      return lines.map((l, i) => {
        if (!this.s.accounts[l.account]) throw E('ACCOUNT_NOT_FOUND', `Line ${i + 1}: unknown account ${l.account}`);
        const debit = toMinor(l.debit == null ? 0 : l.debit, this.s.dec), credit = toMinor(l.credit == null ? 0 : l.credit, this.s.dec);
        if (debit < 0 || credit < 0) throw E('NEGATIVE_AMOUNT', `Line ${i + 1}: negative amount`);
        if ((debit > 0) === (credit > 0)) throw E('LINE_ONE_SIDED', `Line ${i + 1}: exactly one of debit/credit must be > 0`);
        return { account: l.account, debit, credit, memo: l.memo || '', costCenter: l.costCenter || null };
      });
    }

    /* ---------- chart of accounts ---------- */
    addAccount(user, a) {
      this._can(user, 'account.manage');
      const { code, name, nameAr = '', type, parent = null, postable = true, subtype = null } = a;
      if (!code || !name) throw E('ACCOUNT_REQUIRED', 'Account code and name are required');
      if (this.s.accounts[code]) throw E('ACCOUNT_EXISTS', 'Account code already exists: ' + code);
      if (!TYPES.includes(type)) throw E('BAD_TYPE', 'Unknown account type: ' + type);
      let p = null;
      if (parent) {
        p = this.s.accounts[parent];
        if (!p) throw E('PARENT_NOT_FOUND', 'Parent not found: ' + parent);
        if (p.type !== type) throw E('PARENT_TYPE_MISMATCH', 'Parent has a different type');
        if (this._hasLines(parent)) throw E('PARENT_HAS_ACTIVITY', 'Parent already has posted lines');
      }
      if (p) p.postable = false;
      this.s.accounts[code] = { code, name, nameAr, type, parent, postable, subtype, active: true, normal: NORMAL[type] };
      this.s.bal[code] = { d: 0, c: 0 };
      this._log(user, 'account.add', code, { name, type });
    }
    deactivateAccount(user, code) {
      this._can(user, 'account.manage');
      const a = this.s.accounts[code]; if (!a) throw E('ACCOUNT_NOT_FOUND', code);
      a.active = false; this._log(user, 'account.deactivate', code);
    }
    deleteAccount(user, code) {
      this._can(user, 'account.manage');
      if (!this.s.accounts[code]) throw E('ACCOUNT_NOT_FOUND', code);
      if (this._hasLines(code) || this.s.entries.some((e) => e.status !== 'void' && e.lines.some((l) => l.account === code)))
        throw E('ACCOUNT_HAS_ACTIVITY', 'Account is used by entries; deactivate it instead');
      if (Object.values(this.s.accounts).some((a) => a.parent === code)) throw E('ACCOUNT_HAS_CHILDREN', 'Account has child accounts');
      delete this.s.accounts[code]; delete this.s.bal[code];
      this._log(user, 'account.delete', code);
    }

    /* ---------- fiscal periods ---------- */
    openFiscalYear(user, year) {
      this._can(user, 'period.manage');
      if (this.s.years[year]) throw E('YEAR_EXISTS', 'Fiscal year already exists: ' + year);
      for (let mth = 1; mth <= 12; mth++) {
        const mm = String(mth).padStart(2, '0'), last = new Date(Date.UTC(year, mth, 0)).getUTCDate();
        this.s.periods[`${year}-${mm}`] = { id: `${year}-${mm}`, year, start: `${year}-${mm}-01`, end: `${year}-${mm}-${String(last).padStart(2, '0')}`, status: 'open' };
      }
      this.s.years[year] = { year, status: 'open', closingEntry: null };
      this._log(user, 'year.open', String(year));
    }
    closePeriod(user, id) {
      this._can(user, 'period.close');
      const p = this.s.periods[id]; if (!p) throw E('NO_PERIOD', 'Unknown period ' + id);
      p.status = 'closed'; this._log(user, 'period.close', id);
    }
    reopenPeriod(user, id, reason) {
      this._can(user, 'period.reopen');
      if (!reason || !String(reason).trim()) throw E('REASON_REQUIRED', 'A reason is required to reopen a period');
      const p = this.s.periods[id]; if (!p) throw E('NO_PERIOD', 'Unknown period ' + id);
      if (this.s.years[p.year].status === 'closed') throw E('YEAR_CLOSED', 'Year is closed; use reopenYear');
      p.status = 'open'; this._log(user, 'period.reopen', id, { reason });
    }
    _closePeriods(year) { Object.values(this.s.periods).filter((p) => p.year === year).forEach((p) => { p.status = 'closed'; }); }

    /* ---------- journal entries ---------- */
    createEntry(user, input, _internal = false) {
      this._can(user, 'entry.create');
      const { date, description = '', lines, kind = 'regular', source = null, reference = '' } = input;
      if (!okDate(date)) throw E('BAD_DATE', 'Invalid date: ' + date);
      if (!KINDS.includes(kind)) throw E('BAD_KIND', 'Unknown entry kind: ' + kind);
      if (kind === 'closing' && !_internal) throw E('KIND_RESERVED', 'Closing entries are created by closeYear only');
      const e = {
        id: this.s.nextId++, kind, date, description, reference, source, lines: this._lines(lines), status: 'draft', number: null,
        createdBy: user.id, createdAt: this.now(), approvedBy: null, postedBy: null, postedAt: null, reversalOf: null, reversedBy: null,
      };
      this.s.entries.push(e);
      this._log(user, 'entry.create', String(e.id), { kind, date });
      return clone(e);
    }
    updateEntry(user, id, patch) {
      this._can(user, 'entry.create');
      const e = this._entry(id);
      if (e.status !== 'draft') throw E('IMMUTABLE', 'Only drafts can be edited; use a reversal for posted entries');
      const before = clone(e);
      if (patch.date !== undefined) { if (!okDate(patch.date)) throw E('BAD_DATE', 'Invalid date'); e.date = patch.date; }
      if (patch.description !== undefined) e.description = patch.description;
      if (patch.lines !== undefined) e.lines = this._lines(patch.lines);
      this._log(user, 'entry.update', String(id), { before: { date: before.date, description: before.description } });
      return clone(e);
    }
    deleteDraft(user, id) {
      this._can(user, 'entry.create');
      const e = this._entry(id);
      if (e.status !== 'draft') throw E('IMMUTABLE', 'Only drafts can be deleted');
      e.status = 'void'; this._log(user, 'entry.void', String(id));
    }
    approveEntry(user, id) {
      this._can(user, 'entry.approve');
      const e = this._entry(id);
      if (e.status !== 'draft') throw E('BAD_STATE', 'Only drafts can be approved');
      if (this.s.requireApproval && e.createdBy === user.id) throw E('SEGREGATION', 'Creator cannot approve their own entry');
      this._checkBalanced(e);
      e.status = 'approved'; e.approvedBy = user.id; this._log(user, 'entry.approve', String(id));
    }
    _checkBalanced(e) {
      if (e.lines.length < 2) throw E('TOO_FEW_LINES', 'An entry needs at least two lines');
      const d = e.lines.reduce((s, l) => s + l.debit, 0), c = e.lines.reduce((s, l) => s + l.credit, 0);
      if (d !== c) throw E('UNBALANCED', `Debit ${this.f(d)} != Credit ${this.f(c)}`, { debit: d, credit: c });
      if (d === 0) throw E('ZERO_ENTRY', 'Entry total is zero');
    }
    postEntry(user, id) { this._can(user, 'entry.post'); return this._tx(() => this._post(user, id)); }

 const depth=a=>{let d=0,p=a.parent;while(p){d++;p=L.s.accounts[p]&&L.s.accounts[p].parent}return d};
 const tot={};A.forEach(a=>{let p=a.code;const v=bal[a.code];while(p){tot[p]=(tot[p]||0)+v;p=L.s.accounts[p]&&L.s.accounts[p].parent}});
 const tree=[];const walk=(p)=>A.filter(a=>(a.parent||null)===p).forEach(a=>{tree.push(a);walk(a.code)});walk(null);
 return`<div class="card"><h2>${t('addAcc')}</h2><div class="row"><input id="nc" placeholder="${t('code')}" inputmode="numeric"><select id="nt">${['asset','liability','equity','revenue','expense'].map(x=>`<option value="${x}">${t(x==='revenue'?'revenue2':x)}</option>`).join('')}</select></div><input id="nn" placeholder="${t('aname')}"><input id="na" placeholder="${t('anameAr')}">
 <select id="np"><option value="">${t('noParent')}</option>${A.filter(a=>a.active).map(a=>`<option value="${a.code}">${a.code} – ${esc(nm(a))}</option>`).join('')}</select><button class="primary" onclick="addAcc()">${t('addAcc')}</button></div>
 <div class="card sc"><table>${tree.map(a=>`<tr><td style="padding-inline-start:${depth(a)*18+4}px">${a.postable?'':'<b>'}${a.code} ${esc(nm(a))}${a.postable?'':'</b>'} ${a.active?'':`<span class="tag">${t('inactive')}</span>`}</td><td>${fmt(tot[a.code]||0)}</td><td>${a.postable&&a.active?`<button class="x" onclick="deactAcc('${a.code}')">${t('deact')}</button>`:''}<button class="x" onclick="delAcc('${a.code}')">${t('del')}</button></td></tr>`).join('')}</table></div>`}
function addAcc(){const p=$('#np').value,ty=p?L.s.accounts[p].type:$('#nt').value;if(run(()=>L.addAccount(ME(),{code:$('#nc').value.trim(),name:$('#nn').value.trim()||$('#na').value.trim(),nameAr:$('#na').value.trim(),type:ty,parent:p||null})))show()}
function deactAcc(c){if(run(()=>L.deactivateAccount(ME(),c)))show()}
function delAcc(c){if(run(()=>L.deleteAccount(ME(),c)))show()}

/* ---------- Ledger ---------- */
function vLedger(){const A=accts();if(!LA||!L.s.accounts[LA])LA=(A.find(a=>a.postable)||A[0]).code;const r=L.ledger(LA,{from:LF||undefined,to:LTo||undefined});
 return`<div class="card"><h2>${t('gl')}</h2><select onchange="LA=this.value;show()">${A.map(a=>`<option value="${a.code}" ${a.code===LA?'selected':''}>${a.code} – ${esc(nm(a))}</option>`).join('')}</select>
 <div class="row"><input type="date" value="${LF}" onchange="LF=this.value;show()" aria-label="${t('from')}"><input type="date" value="${LTo}" onchange="LTo=this.value;show()" aria-label="${t('to')}"></div>
 <div class="sc"><table><tr><th>${t('dd')}</th><th>${t('dr')}</th><th>${t('cr')}</th><th>${t('balance')}</th></tr>${LF?`<tr><td>${t('openBal')}</td><td></td><td></td><td>${fmt(r.opening)}</td></tr>`:''}${r.rows.map(x=>`<tr><td>${x.date} · ${x.number}<br><small>${esc(x.description)}</small></td><td>${z(x.debit)}</td><td>${z(x.credit)}</td><td>${fmt(x.balance)}</td></tr>`).join('')||`<tr><td colspan="4">${t('noAct')}</td></tr>`}</table></div></div>`}

/* ---------- Trial balance ---------- */
function vTb(){const from=RF||YR+'-01-01',to=RTo||YR+'-12-31',stg={raw:'unadjusted',adj:'adjusted',post2:'postClosing'}[TS];
 const rr=L.trialBalance({from,to,stage:stg}),RT_=rr.totals,det=TD&&TS!=='post2';
 return`<div class="seg">${['raw','adj','post2'].map(x=>`<button class="${TS===x?'on':''}" onclick="TS='${x}';show()">${t(x)}</button>`).join('')}</div>
 <div class="card"><h2>${t('tb')}</h2>${hdr()}<div class="row"><input type="date" value="${from}" onchange="RF=this.value;show()"><input type="date" value="${to}" onchange="RTo=this.value;show()"></div>
 <label class="m"><input type="checkbox" style="width:auto;margin-inline-end:6px" ${TD?'checked':''} onchange="TD=this.checked;show()">${t('detailed')}</label>
 <div class="sc"><table><tr><th>${t('account')}</th>${det?`<th>${t('openC')} ${t('dr')}</th><th>${t('openC')} ${t('cr')}</th><th>${t('movC')} ${t('dr')}</th><th>${t('movC')} ${t('cr')}</th>`:''}<th>${t('dr')}</th><th>${t('cr')}</th></tr>
 ${rr.rows.map(x=>`<tr><td>${x.code} ${esc(nm(L.s.accounts[x.code]))}</td>${det?`<td>${z(x.openDr)}</td><td>${z(x.openCr)}</td><td>${z(x.movDr)}</td><td>${z(x.movCr)}</td>`:''}<td>${z(x.closeDr)}</td><td>${z(x.closeCr)}</td></tr>`).join('')||`<tr><td colspan="3">${t('none')}</td></tr>`}
 <tr class="t"><td>${t('total')}</td>${det?`<td>${fmt(RT_.openDr)}</td><td>${fmt(RT_.openCr)}</td><td>${fmt(RT_.movDr)}</td><td>${fmt(RT_.movCr)}</td>`:''}<td>${mny(RT_.closeDr)}</td><td>${mny(RT_.closeCr)}</td></tr></table></div>
 <p class="tot ${rr.balanced?'ok':'bad'}">${rr.balanced?t('balOk'):t('balNo')+' ('+fmt(rr.difference)+')'}</p>
 <div class="row noprint"><button class="gold" onclick="csv('trial-balance.csv',[['Code','Account','Debit','Credit']].concat(L.trialBalance({from:'${from}',to:'${to}',stage:'${stg}'}).rows.map(x=>[x.code,L.s.accounts[x.code].name,L.f(x.closeDr),L.f(x.closeCr)])))">${t('csv')}</button><button class="gold" onclick="print()">${t('print')}</button></div></div>`}

/* ---------- Reports ---------- */
function csv(name,rows){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';dl(name,new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}))}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
let CSVROWS=[];
function repIS(from,to){const r=L.incomeStatement({from,to}),T=r.totals;CSVROWS=[];const row=(l,v,c)=>{CSVROWS.push([l,L.f(v)]);return tr(l,mny(v),c)},det=a=>a.map(x=>row(x.code+' '+esc(nm(L.s.accounts[x.code])),x.amount)).join('');
 return`<table>${det(r.revenue)}${row(t('tRev'),T.revenue,'t')}${det(r.cogs)}${row(t('cogs'),T.cogs,'t')}${row(t('gp'),T.grossProfit,'g')}${det(r.opex)}${row(t('opex'),T.opex,'t')}${row(t('op'),T.operatingProfit,'t')}${det(r.otherIncome)}${row(t('oi'),T.otherIncome)}${det(r.finance)}${row(t('fin'),T.finance)}${row(t('pbt'),T.profitBeforeTax,'t')}${det(r.tax)}${row(t('tax'),T.tax)}${row(t(T.netIncome>=0?'ni':'nl'),Math.abs(T.netIncome),'g')}</table>`}
function repBS(to){const r=L.balanceSheet({asOf:to}),T=r.totals;CSVROWS=[];const row=(l,v,c)=>{CSVROWS.push([l,L.f(v)]);return tr(l,mny(v),c)},det=a=>a.map(x=>row(x.code+' '+esc(nm(L.s.accounts[x.code])),x.amount)).join('');
 return`<table>${tr('<b>'+t('curAs')+'</b>','')}${det(r.assets.current)}${tr('<b>'+t('ncAs')+'</b>','')}${det(r.assets.noncurrent)}${row(t('tAs'),T.assets,'t g')}${tr('<b>'+t('curLi')+'</b>','')}${det(r.liabilities.current)}${tr('<b>'+t('ncLi')+'</b>','')}${det(r.liabilities.noncurrent)}${row(t('tLi'),T.liabilities,'t')}${tr('<b>'+t('eqS')+'</b>','')}${det(r.equity)}${row(t('curRes'),T.currentResult)}${row(t('tEq'),T.equity,'t')}${row(t('tLE'),T.liabilitiesAndEquity,'t g')}</table><p class="tot ${r.balanced?'ok':'bad'}">${t(r.balanced?'eqOk':'eqNo')}</p>`}
function repJ(from,to,kind){const es=L.listEntries({status:'posted',from,to}).filter(e=>!kind||e.kind===kind).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);CSVROWS=[['Number','Date','Type','Description','Source','Code','Account','Debit','Credit']];let D_=0,C_=0;
 const h=es.map(e=>{e.lines.forEach(l=>{D_+=l.debit;C_+=l.credit;CSVROWS.push([e.number,e.date,e.kind,e.description,e.source?e.source.type+' #'+e.source.id:'',l.account,L.s.accounts[l.account].name,L.f(l.debit),L.f(l.credit)])});
  return`<div style="margin-bottom:10px"><div class="eh"><b>${e.number}</b><span>${e.date}</span><span class="tag">${t(e.kind)}</span></div><p class="m">${esc(e.description)}${e.source?' · '+srcTxt(e.source):''}</p><table>${e.lines.map(l=>`<tr><td>${l.account} ${esc(nm(L.s.accounts[l.account]))}</td><td>${z(l.debit)}</td><td>${z(l.credit)}</td></tr>`).join('')}</table></div>`}).join('');
 return es.length?h+`<table>${tr(t('totals'),'')}<tr class="t"><td>${t('dr')} / ${t('cr')}</td><td>${mny(D_)}</td><td>${mny(C_)}</td></tr></table>`:`<p class="m">${t('none')}</p>`}
function vReports(){const from=RF||YR+'-01-01',to=RTo||YR+'-12-31',T=[['is','is'],['bs','bs'],['jb','jb'],['adj','ar'],['cls','cr2']];
 const body=RT==='is'?repIS(from,to):RT==='bs'?repBS(to):RT==='jb'?repJ(from,to,''):RT==='adj'?repJ(from,to,'adjusting'):repJ(from,to,'closing');
 return`<div class="seg">${T.map(x=>`<button class="${RT===x[0]?'on':''}" onclick="RT='${x[0]}';show()">${t(x[1])}</button>`).join('')}</div>
 <div class="card"><h2>${t({is:'is',bs:'bs',jb:'jb',adj:'ar',cls:'cr2'}[RT])}</h2>${hdr()}<div class="row noprint">${RT!=='bs'?`<input type="date" value="${from}" onchange="RF=this.value;show()">`:''}<input type="date" value="${to}" onchange="RTo=this.value;show()"></div><div class="sc">${body}</div>
 <div class="row noprint"><button class="gold" onclick="csv('${RT}-report.csv',CSVROWS)">${t('csv')}</button><button class="gold" onclick="print()">${t('print')}</button></div></div>`}

/* ---------- Cycle ---------- */
function vCycle(){const y=YR,yr=L.s.years[y]||{status:'open'},st=steps(y),ps=Object.values(L.s.periods).filter(p=>p.year===y).sort((a,b)=>a.id.localeCompare(b.id));
 return`<div class="card"><div class="row"><select onchange="YR=+this.value;show()">${yearOpts()}</select><button class="gold" onclick="addYear()">${t('addYear')}</button></div></div>
 <div class="card"><h2>${t('cycleT')||t('cycle')}</h2>${st.map(s=>`<div class="st"><span>${s[1]?'✅':'⬜'} ${t(s[0])}</span><span class="tag">${s[2]}</span></div>`).join('')}</div>
 <div class="card"><h2>${t('closeYear')} ${y}</h2><p class="m">${t('closeNote')}</p>${yr.status==='closed'?`<button class="ghost" onclick="reopenYr()">${t('reopenYear')}</button>`:`<button class="primary" onclick="closeYr()">${t('closeYear')}</button>`}</div>
 <div class="card"><h2>${t('periods')}</h2><table>${ps.map(p=>`<tr><td>${p.id}</td><td><span class="tag">${t(p.status==='open'?'open':'closed')}</span></td><td>${yr.status==='closed'?'':p.status==='open'?`<button class="x" onclick="perClose('${p.id}')">${t('closeP')}</button>`:`<button class="lnk" onclick="perOpen('${p.id}')">${t('reopenP')}</button>`}</td></tr>`).join('')}</table></div>`}
D.cycleT=D.cycle;
function addYear(){const ys=Object.keys(L.s.years).map(Number),n=Math.max(...ys)+1;if(run(()=>ensureYear(n))){YR=n;show()}}
function closeYr(){if(confirm(t('cClose'))&&run(()=>L.closeYear(ME(),{year:YR})))show()}
function reopenYr(){const r=prompt(t('reasonQ'));if(r&&run(()=>L.reopenYear(ME(),{year:YR,reason:r})))show()}
function perClose(id){if(run(()=>L.closePeriod(ME(),id)))show()}
function perOpen(id){const r=prompt(t('reasonQ'));if(r&&run(()=>L.reopenPeriod(ME(),id,r)))show()}

/* ---------- Audit ---------- */
function vAudit(){const rep=L.integrityReport(),a=[...L.s.audit].reverse().slice(0,300);
 return`<div class="card"><h2>${t('integrity')}</h2><p class="tot ${rep.ok?'ok':'bad'}">${rep.ok?t('intOk'):t('intBad')+' ('+rep.problems.length+')'}</p></div>
 <div class="card sc"><h2>${t('auditT')}</h2><table><tr><th>${t('time')}</th><th>${t('user')}</th><th>${t('action')}</th><th>${t('ref')}</th></tr>${a.map(r=>`<tr><td>${esc(r.ts.slice(0,19).replace('T',' '))}</td><td>${esc(r.user)}</td><td>${esc(r.action)}</td><td>${esc(r.ref)}</td></tr>`).join('')||`<tr><td colspan="4">${t('none')}</td></tr>`}</table></div>`}

/* ---------- Settings ---------- */
function setS(k,v){ST[k]=v;persist();show()}
function vSettings(){const s=ST,row=(l,c)=>`<div class="set"><span>${l}</span>${c}</div>`,
 sel=(k,o)=>`<select onchange="setS('${k}',this.value)">${o.map(x=>`<option value="${x[0]}" ${String(s[k])===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select>`,
 chk=k=>`<input type="checkbox" ${s[k]?'checked':''} onchange="setS('${k}',this.checked)">`,txt=k=>`<input class="ti" value="${esc(s[k])}" onchange="setS('${k}',this.value)">`;
 return`<div class="card"><h2>${t('general')}</h2>${row(t('language'),sel('lang',[['en','English'],['ar','العربية']]))}${row(t('currency'),sel('cur',CUR.map(c=>[c[0],c[0]+' ('+c[1]+')'])))}${row(t('decimals'),sel('dd',[[0,'0'],[2,'2']]))}${row(t('theme'),sel('theme',[['auto',t('auto2')],['light',t('light')],['dark',t('dark')]]))}${row(t('tsize'),sel('size',[['s',t('small')],['m',t('medium')],['l',t('large')]]))}</div>
 <div class="card"><h2>${t('company')}</h2>${row(t('coName'),txt('co'))}${row(t('prepBy'),txt('acct'))}</div>
 <div class="card"><h2>${t('security')}</h2><p class="m">${s.pw?t('pwOn'):t('pwOff')}</p>${s.pw?`<input type="password" id="pc" placeholder="${t('curPw')}">`:''}<input type="password" id="pn" placeholder="${t('newPw')}"><input type="password" id="pn2" placeholder="${t('confPw')}"><button class="primary" onclick="setPw()">${t('savePw')}</button>${s.pw?`<button class="ghost" style="margin-top:8px" onclick="rmPw()">${t('rmPw')}</button><button class="ghost" onclick="lock()">${t('lockNow')}</button>${row(t('lockLeave'),chk('lockLeave'))}`:''}</div>
 <div class="card"><h2>${t('look')}</h2>${row(t('wmShow'),chk('wm'))}<div class="set"><span>${t('wmStr')}</span><input type="range" min="4" max="30" value="${s.wmo}" oninput="ST.wmo=+this.value;apply()" onchange="persist()"></div></div>
 <div class="card"><h2>${t('data')}</h2><p class="m">${t('dataP')}</p><div class="row"><button class="gold" onclick="exportData()">${t('backup')}</button><button class="gold" onclick="$('#imp').click()">${t('restore')}</button><button class="gold" onclick="checkInt()">${t('check')}</button></div><input type="file" id="imp" accept=".json" hidden onchange="importData(this.files[0])"><button class="x" style="margin-top:10px" onclick="resetAll()">${t('reset')}</button></div>
 <div class="card" style="text-align:center"><h2>${t('about')}</h2><div class="logo big" style="margin:8px auto">AM</div><b style="font-family:Georgia,serif">Abdelazeem Mandour</b><p class="m">${t('sub')} · v3.0</p></div>`}
async function H(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('am|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'am|'+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
async function setPw(){const n=$('#pn').value;if(ST.pw&&await H($('#pc').value)!==ST.pw)return alert(t('ePwBad'));if(n.length<4)return alert(t('ePwLen'));if(n!==$('#pn2').value)return alert(t('ePwMis'));ST.pw=await H(n);persist();alert(t('pwSaved'));show()}
async function rmPw(){if(await H($('#pc').value)!==ST.pw)return alert(t('ePwBad'));ST.pw='';ST.lockLeave=false;persist();alert(t('pwRemoved'));show()}
function lock(){if(!ST.pw)return;let K=$('#lock');if(!K){K=document.createElement('div');K.id='lock';document.body.append(K)}
 K.innerHTML=`<div class="logo big">AM</div><h1>Abdelazeem Mandour</h1><p>${t('enterPw')}</p><input type="password" id="lp" autocomplete="current-password"><div class="err" id="le"></div><button class="primary" onclick="unlock()">${t('unlock')}</button>`;K.style.display='flex';const i=$('#lp');i.onkeydown=e=>{if(e.key==='Enter')unlock()};setTimeout(()=>i.focus(),50)}
async function unlock(){if(await H($('#lp').value)===ST.pw)$('#lock').style.display='none';else $('#le').textContent=t('ePwBad')}
function exportData(){dl('accounting-backup.json',new Blob([JSON.stringify({version:3,ledger:L.toJSON(),settings:ST})],{type:'application/json'}))}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);L=Ledger.fromJSON(d.ledger);if(d.settings)ST=Object.assign(ST,d.settings);noSave=false;persist();show()}catch(e){alert(t('badFile'))}};r.readAsText(f)}
function checkInt(){const r=L.integrityReport();alert(r.ok?t('intOk'):t('intBad')+'\n'+r.problems.map(p=>p.type).join('\n'))}
function resetAll(){if(confirm(t('cReset'))){L=fresh();noSave=false;EDIT=0;persist();show()}}

const V={dash:vDash,entries:vEntries,coa:vCoa,ledger:vLedger,tb:vTb,reports:vReports,cycle:vCycle,audit:vAudit,settings:vSettings};
init();YR=Object.keys(L.s.years).map(Number).sort().pop()||YR;show();lock();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ST.lockLeave)lock()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
